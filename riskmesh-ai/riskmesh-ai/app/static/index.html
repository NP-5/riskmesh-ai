<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiskMesh AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','Inter','system-ui','Segoe UI','sans-serif']}}}}</script>
<style>
body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:#f6f9fc;color:#2A3547;-webkit-font-smoothing:antialiased}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .mark{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}#splash h1{animation:rise .8s .3s both}
#splash .bar{width:160px;height:3px;background:#ECF2FF;border-radius:9px;overflow:hidden;margin-top:28px}#splash .bar i{display:block;height:100%;width:0;background:#5D87FF;animation:load 2s .2s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}@keyframes load{to{width:100%}}
.fade{animation:rise .5s both}svg text{font-family:inherit}
</style></head><body>
<div id="splash"><svg class="mark" width="72" height="72" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#5D87FF"/><g stroke="#fff" stroke-width="2"><path d="M24 11 36 18v12L24 37 12 30V18z" opacity=".55"/><path d="M24 11v26M12 18l24 12M36 18 12 30" opacity=".35"/></g><g fill="#fff"><circle cx="24" cy="11" r="3"/><circle cx="36" cy="18" r="3"/><circle cx="36" cy="30" r="3"/><circle cx="24" cy="37" r="3"/><circle cx="12" cy="30" r="3"/><circle cx="12" cy="18" r="3"/></g></svg>
<h1 class="mt-6 text-4xl font-extrabold tracking-tight text-[#2A3547]">RiskMesh <span class="text-[#5D87FF]">AI</span></h1><div class="bar"><i></i></div></div>
<div id="app"></div><div id="chat" style="display:none"></div>
<script>
const $=s=>document.querySelector(s),api=(p,o)=>fetch(p,o).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.detail||r.status);return j});
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const CARD="bg-white rounded-xl border border-[#e5eaef] shadow-sm p-6 mb-6",H="text-xs font-bold uppercase tracking-wider text-[#5A6A85] mb-4";
const B1="inline-flex items-center justify-center rounded-lg bg-[#5D87FF] hover:bg-[#4570EA] text-white text-sm font-semibold px-5 py-2.5 transition cursor-pointer",B2="inline-flex items-center justify-center rounded-lg border border-[#5D87FF] text-[#5D87FF] bg-white hover:bg-[#ECF2FF] text-sm font-semibold px-5 py-2.5 transition cursor-pointer",B3="inline-flex items-center justify-center rounded-lg bg-[#FA896B] hover:bg-[#e8745a] text-white text-sm font-semibold px-5 py-2.5 transition cursor-pointer";
const TONE={supports:"bg-[#FDEDE8] text-[#d9573a]",contradicts:"bg-[#E6FFFA] text-[#0fa88f]",neutral:"bg-[#EEF1F6] text-[#5A6A85]",pending:"bg-[#EEF1F6] text-[#5A6A85]",info:"bg-[#ECF2FF] text-[#5D87FF]",warn:"bg-[#FEF5E5] text-[#d98a00]"};
const pill=(t,k="info")=>`<span class="inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold ${TONE[k]||TONE.info}">${esc(t)}</span>`;
const kpi=(k,v,c="#5D87FF")=>`<div class="bg-white rounded-xl border border-[#e5eaef] shadow-sm p-5 border-t-4" style="border-top-color:${c}"><div class="text-2xl font-extrabold">${v}</div><div class="text-xs font-medium text-[#5A6A85] mt-1">${k}</div></div>`;
const LOGO=`<span class="flex items-center gap-2.5"><svg width="32" height="32" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="12" fill="#5D87FF"/><g stroke="#fff" stroke-width="2" opacity=".5"><path d="M24 11 36 18v12L24 37 12 30V18z"/></g><g fill="#fff"><circle cx="24" cy="11" r="3.5"/><circle cx="36" cy="30" r="3.5"/><circle cx="12" cy="30" r="3.5"/></g></svg><b class="text-lg font-extrabold tracking-tight">RiskMesh <span class="text-[#5D87FF]">AI</span></b></span>`;
let CASES=[];
const gauge=(t,val,pct,col,sub,l1,l2)=>{const R=54,L=2*Math.PI*R,d=L*Math.min(Math.max(pct,0),100)/100;return `<div class="bg-white rounded-xl border border-[#e5eaef] shadow-sm p-6"><div class="font-bold text-lg mb-4">${t}</div><div class="relative w-40 h-40 mx-auto"><svg viewBox="0 0 128 128" class="w-full h-full -rotate-90"><circle cx="64" cy="64" r="${R}" fill="none" stroke="#ECF2FF" stroke-width="10"/><circle cx="64" cy="64" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 ${L}" data-d="${d} ${L-d}" style="transition:stroke-dasharray 1.2s ease"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><b class="text-4xl font-extrabold">${val}</b><span class="text-[11px] font-semibold tracking-wider text-[#5A6A85] uppercase">${sub}</span></div></div><div class="flex justify-between mt-5 text-xs text-[#5A6A85]">${[l1,l2].map(l=>`<span class="flex items-center gap-1.5"><i class="w-2 h-2 rounded-full" style="background:${l[0]}"></i>${l[1]}</span>`).join("")}</div></div>`};
/* ---------- AI chat ---------- */
const CHAT=[{r:"bot",t:"Hi, I'm the RiskMesh assistant. Ask about active cases, pending reviews, AI agreement, or a specific case."}];let chatOpen=false;
function chatRender(){const m=CHAT.map(x=>`<div class="flex ${x.r==="me"?"justify-end":""}"><div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${x.r==="me"?"bg-[#5D87FF] text-white":"bg-[#f6f9fc] text-[#2A3547]"}">${esc(x.t).replace(/\n/g,"<br>")}</div></div>`).join("");
$("#chat").innerHTML=(chatOpen?`<div class="fixed bottom-24 right-6 z-40 w-[22rem] max-w-[calc(100vw-2rem)] h-[30rem] bg-white rounded-2xl border border-[#e5eaef] shadow-2xl flex flex-col"><div class="flex items-center justify-between px-5 py-4 border-b border-[#e5eaef]"><div><b>RiskMesh Assistant</b><div class="text-xs text-[#13DEB9] font-semibold">● Online</div></div><button class="text-[#5A6A85] text-xl" onclick="chatToggle()">×</button></div>
<div id="cmsgs" class="flex-1 overflow-auto p-4 space-y-3">${m}</div><div class="px-4 pb-2 flex flex-wrap gap-1.5">${["Pending reviews","Highest-risk case","AI agreement"].map(c=>`<button class="text-xs rounded-full border border-[#e5eaef] px-3 py-1 text-[#5D87FF] font-semibold hover:bg-[#ECF2FF]" onclick="chatSend('${c}')">${c}</button>`).join("")}</div>
<div class="p-3 border-t border-[#e5eaef] flex gap-2"><input id="cin" class="flex-1 rounded-lg border border-[#e5eaef] bg-[#f6f9fc] px-3 py-2 text-sm focus:outline-none focus:border-[#5D87FF]" placeholder="Ask about a case…" onkeydown="if(event.key==='Enter')chatSend()"><button class="${B1} !px-4" onclick="chatSend()">Send</button></div></div>`:"")+
`<button aria-label="Open AI assistant" onclick="chatToggle()" class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-xl bg-[#2563EB] hover:bg-[#1d4fd8] text-white shadow-xl flex items-center justify-center transition"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h12v8H8l-3 3v-3H3z"/><path d="M18 9h3v9h-2v3l-3-3H9v-3"/></svg></button>`;const b=$("#cmsgs");if(b)b.scrollTop=b.scrollHeight;if(chatOpen&&$("#cin"))$("#cin").focus()}
const chatToggle=()=>{chatOpen=!chatOpen;chatRender()};
async function chatSend(t){const i=$("#cin");t=t||(i&&i.value.trim());if(!t)return;CHAT.push({r:"me",t},{r:"bot",t:"Checking the case data…"});chatRender();
 try{const cid=location.hash.startsWith("#/case/")?location.hash.slice(7):null;CHAT[CHAT.length-1].t=(await post("/chat",{message:t,case_id:cid})).reply}catch(e){CHAT[CHAT.length-1].t="Sorry, I couldn't reach the server."}chatRender()}
const mount=h=>{$("#app").innerHTML=h;scrollTo(0,0)};

/* ---------- Landing ---------- */
const FEATS=[["Graph risk detection","Maps customers, devices, accounts and beneficiaries to surface coordinated payment rings."],["Conversation evidence","Reads context from customer conversations as supporting signals, never as a verdict."],["Adversarial critic","A Critic Agent challenges every conclusion and lists weaknesses before anyone acts."],["Intervention simulation","Compares bounded responses by risk reduction, legitimate-customer impact and cost."],["Human governance","Analysts approve or override each recommendation, recorded in an append-only audit trail."],["Rule re-engineering","Proposes rule changes and backtests them; nothing goes live without human approval."]];
const STEPS=["Detect","Investigate","Challenge","Simulate","Decide"];
async function landing(){
 const [sc,m]=await Promise.all([api("/demo/scenarios"),api("/metrics")]);
 mount(`<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-[#e5eaef]"><div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">${LOGO}
 <nav class="hidden md:flex gap-8 text-sm font-semibold text-[#5A6A85]"><a href="#features" class="hover:text-[#5D87FF]" onclick="go('features');return false">Capabilities</a><a href="#flow" class="hover:text-[#5D87FF]" onclick="go('flow');return false">Workflow</a><a href="#scenarios" class="hover:text-[#5D87FF]" onclick="go('scenarios');return false">Live cases</a></nav>
 <a class="${B1}" href="#/dashboard">Open Dashboard</a></div></header>
 <section class="bg-gradient-to-b from-[#ECF2FF] to-[#f6f9fc]"><div class="max-w-6xl mx-auto px-6 py-20 grid lg:grid-cols-2 gap-12 items-center fade">
  <div><span class="${TONE.info} rounded-full px-3 py-1 text-xs font-bold uppercase tracking-wider">Payment risk intelligence</span>
  <h1 class="mt-5 text-4xl md:text-6xl font-extrabold tracking-tight leading-[1.05]">RiskMesh <span class="text-[#5D87FF]">AI</span></h1>
  <p class="mt-5 text-lg text-[#5A6A85] max-w-lg leading-relaxed">Detect coordinated payment risk, investigate with specialised AI agents, and keep every decision reviewed and auditable.</p>
  <div class="mt-8 flex flex-wrap gap-3"><a class="${B1}" href="#/dashboard">Open Dashboard</a><a class="${B2}" href="#/case/${sc.ring}">View a live case</a></div></div>
  <div class="bg-white rounded-2xl border border-[#e5eaef] shadow-lg p-6"><div class="flex items-center justify-between mb-5"><b>Risk overview</b>${pill("Live","contradicts")}</div>
   <div class="grid grid-cols-2 gap-4">${kpi("Active cases",m.active_cases)}${kpi("High-risk networks",m.high_risk_networks,"#FA896B")}${kpi("Pending reviews",m.pending_reviews,"#FFAE1F")}${kpi("AI agreement",m.ai_recommendation_agreement??"–","#13DEB9")}</div>
   <div class="mt-5 h-2 rounded-full bg-[#ECF2FF] overflow-hidden"><div class="h-full w-2/3 bg-[#5D87FF] rounded-full"></div></div></div></div></section>
 <section id="features" class="max-w-6xl mx-auto px-6 py-20"><div class="text-center max-w-xl mx-auto mb-12"><h2 class="text-3xl font-extrabold tracking-tight">Built for risk and fraud teams</h2><p class="mt-3 text-[#5A6A85]">Every capability is evidence-grounded and designed around human accountability.</p></div>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">${FEATS.map(([t,d],i)=>`<div class="bg-white rounded-xl border border-[#e5eaef] p-6 shadow-sm hover:shadow-md transition"><div class="w-11 h-11 rounded-lg bg-[#ECF2FF] text-[#5D87FF] font-extrabold flex items-center justify-center mb-4">${i+1}</div><h3 class="font-bold mb-2">${t}</h3><p class="text-sm text-[#5A6A85] leading-relaxed">${d}</p></div>`).join("")}</div></section>
 <section id="flow" class="bg-white border-y border-[#e5eaef]"><div class="max-w-6xl mx-auto px-6 py-16"><h2 class="text-2xl font-extrabold text-center mb-10">From signal to decision</h2><div class="grid grid-cols-2 md:grid-cols-5 gap-4">${STEPS.map((s,i)=>`<div class="text-center"><div class="mx-auto w-12 h-12 rounded-full bg-[#5D87FF] text-white font-bold flex items-center justify-center">${i+1}</div><div class="mt-3 font-semibold">${s}</div></div>`).join("")}</div></div></section>
 <section id="scenarios" class="max-w-6xl mx-auto px-6 py-20 text-center"><h2 class="text-3xl font-extrabold tracking-tight">Explore a live case</h2><p class="mt-3 text-[#5A6A85]">Open an investigation and run the full agent workflow.</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3"><a class="${B1}" href="#/case/${sc.ring}">Suspicious Payment Ring</a><a class="${B2}" href="#/case/${sc.legit}">Legitimate Merchant Network</a><a class="${B2}" href="#/case/${sc.ambiguous}">Ambiguous Case</a></div></section>
 <footer class="border-t border-[#e5eaef] bg-white"><div class="max-w-6xl mx-auto px-6 py-6 flex justify-between text-sm text-[#5A6A85]">${LOGO}<span class="self-center">© 2026 RiskMesh AI</span></div></footer>`)}
const go=id=>document.getElementById(id).scrollIntoView({behavior:"smooth"});

/* ---------- Dashboard shell ---------- */
function shell(body,active){
 const nav=(h,t,on)=>`<a href="${h}" class="flex items-center rounded-lg px-4 py-2.5 text-sm font-semibold ${on?"bg-[#5D87FF] text-white":"text-[#2A3547] hover:bg-[#ECF2FF] hover:text-[#5D87FF]"}">${t}</a>`;
 mount(`<div class="flex min-h-screen"><aside class="hidden lg:flex w-64 shrink-0 flex-col bg-white border-r border-[#e5eaef] p-5 fixed inset-y-0"><a href="#/" class="mb-8 px-1">${LOGO}</a>
  <div class="text-xs font-bold uppercase tracking-wider text-[#5A6A85] mb-2 px-2">Overview</div>${nav("#/dashboard","Dashboard",active==="dash")}
  <div class="text-xs font-bold uppercase tracking-wider text-[#5A6A85] mt-6 mb-2 px-2">Investigations</div><div class="space-y-1 overflow-auto">${CASES.map(c=>nav("#/case/"+c.case_id,c.case_id,active===c.case_id)).join("")}</div>
  <div class="mt-auto">${nav("#/","← Back to site",false)}</div></aside>
  <div class="flex-1 lg:ml-64 min-w-0"><div class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-[#e5eaef] h-16 px-6 flex items-center justify-between"><a href="#/" class="lg:hidden">${LOGO}</a><b class="hidden lg:block">Risk Operations</b><div class="flex items-center gap-3 text-sm"><span class="hidden sm:inline text-[#5A6A85]">Analyst</span><span class="w-9 h-9 rounded-full bg-[#ECF2FF] text-[#5D87FF] font-bold flex items-center justify-center">A</span></div></div>
  <main class="p-6 max-w-6xl fade">${body}</main></div></div>`)}
async function dashboard(){
 const [m,cs]=await Promise.all([api("/metrics"),api("/cases")]);CASES=cs;const b=m.baseline,ac=m.active_cases||1,hr=m.high_risk_networks/ac*100,pd=m.pending_reviews/ac*100,ag=m.ai_recommendation_agreement==null?null:m.ai_recommendation_agreement*100;
 shell(`<h1 class="text-2xl font-extrabold mb-1">Dashboard</h1><p class="text-sm text-[#5A6A85] mb-6">Portfolio risk, investigations and rule governance.</p>
 <div class="grid md:grid-cols-3 gap-6 mb-6">${gauge("Active Cases",m.active_cases,hr,"#13DEB9","Active",["#13DEB9","Open "+m.active_cases],["#5D87FF","High-risk "+m.high_risk_networks])}${gauge("Pending Reviews",m.pending_reviews,pd,"#FFAE1F","Pending",["#FFAE1F","Awaiting "+m.pending_reviews],["#13DEB9","Reviewed "+Math.max(m.active_cases-m.pending_reviews,0)])}${gauge("AI Recommendation",ag==null?"–":Math.round(ag)+"%",ag||0,"#5D87FF","Agreement",["#5D87FF","Matched "+(ag==null?"–":Math.round(ag)+"%")],["#FA896B","Overridden "+(ag==null?"–":Math.round(100-ag)+"%")])}</div>
 <div class="grid grid-cols-2 xl:grid-cols-3 gap-4 mb-6">${kpi("High-risk networks",m.high_risk_networks,"#FA896B")}${kpi("FPR (active rule, backtest)",m.false_positive_rate_active_rule_backtest,"#13DEB9")}${kpi("Avg investigation (s)",m.avg_investigation_seconds??"–")}</div>
 <div class="${CARD}"><div class="${H}">Cases</div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-[#5A6A85]">${["Case","Scenario","Members","Structural","Escalation","Top beneficiary","Status",""].map(x=>`<th class="py-2 pr-4 font-semibold">${x}</th>`).join("")}</tr></thead><tbody>${cs.map(c=>`<tr class="border-t border-[#e5eaef]"><td class="py-3 pr-4 font-bold">${c.case_id}</td><td class="pr-4">${esc(c.demo_scenario)}</td><td class="pr-4">${c.members}</td><td class="pr-4">${c.structural_risk}</td><td class="pr-4">${c.escalation_signal}</td><td class="pr-4">${esc(c.top_beneficiary)}</td><td class="pr-4">${pill(c.status.replace(/_/g," "),"warn")}</td><td><a class="text-[#5D87FF] font-semibold" href="#/case/${c.case_id}">Open →</a></td></tr>`).join("")}</tbody></table></div></div>
 <div class="grid lg:grid-cols-2 gap-6"><div class="${CARD}"><div class="${H}">Top beneficiary concentration</div>${m.beneficiary_concentration.map(x=>`<div class="flex justify-between py-2 border-b border-[#e5eaef] text-sm last:border-0"><span class="font-semibold">${esc(x.beneficiary)}</span><span>${inr(x.exposure_inr)}</span></div>`).join("")}<p class="text-xs text-[#5A6A85] mt-3">Rules ${m.active_rule_version} · ${m.dataset.transactions} transactions · ${m.dataset.events_superseded} superseded revisions</p></div>
 <div class="${CARD}"><div class="${H}">Baseline evaluation</div><div class="grid grid-cols-2 gap-3 text-sm">${[["Ring precision",b.ring_detection_precision],["Ring recall",b.ring_detection_recall],["Avg lead time (h)","~"+b.avg_lead_time_hours],["Cash-out precision",b.cashout_prediction_precision],["Legit customers affected",b.legitimate_customers_affected]].map(([k,v])=>`<div><div class="text-xl font-extrabold">${v}</div><div class="text-xs text-[#5A6A85]">${k}</div></div>`).join("")}</div></div></div>
 <div class="${CARD}"><div class="${H}">AI tools</div><button class="${B1} mr-2" onclick="runEval()">Run AI evaluation</button><button class="${B2}" onclick="rules()">Rule re-engineering</button><div id="extra" class="mt-4"></div></div>`,"dash");setTimeout(()=>document.querySelectorAll("circle[data-d]").forEach(c=>c.style.strokeDasharray=c.dataset.d),80)}
async function runEval(){const e=await post("/evaluation/run");delete e.per_case;$("#extra").innerHTML=`<pre class="text-xs bg-[#f6f9fc] rounded-lg p-4 max-h-64 overflow-auto whitespace-pre-wrap">${esc(JSON.stringify(e,null,1))}</pre>`}
async function rules(){const p=await post("/rules/propose");$("#extra").innerHTML=`<div class="font-bold mb-1">Proposal ${p.proposal_id} ${pill(p.status)}</div><p class="text-sm text-[#5A6A85] mb-3">${esc(p.explanation)}</p><table class="w-full text-sm mb-4"><tr class="text-left text-[#5A6A85]"><th></th><th>Before</th><th>After</th></tr>${["precision","recall","false_positive_rate","false_negative_rate","affected_legitimate_customers","investigation_volume","avg_lead_time_hours"].map(k=>`<tr class="border-t border-[#e5eaef]"><td class="py-2">${k}</td><td>${p.backtest.before[k]}</td><td>${p.backtest.after[k]}</td></tr>`).join("")}</table><button class="${B1}" onclick="ruleOk('${p.proposal_id}')">Approve (human)</button>`}
async function ruleOk(id){try{await post(`/rules/${id}/approve`,{actor:"risk_lead",reason:"Reviewed backtest"});dashboard()}catch(e){alert(e.message)}}

/* ---------- Case ---------- */
function graphSvg(g){const cols=["customer","account","device","ip","instrument","transaction","beneficiary","merchant"],by={};g.nodes.forEach(n=>(by[n.type]??=[]).push(n));const used=cols.filter(c=>by[c]),pos={};
used.forEach((t,i)=>by[t].forEach((n,j)=>pos[n.id]=[60+i*(780/Math.max(used.length-1,1)),30+j*(340/Math.max(by[t].length,1))]));
return `<svg viewBox="0 0 900 420" class="w-full h-auto bg-[#f6f9fc] rounded-lg">${g.edges.map(e=>pos[e.source]&&pos[e.target]?`<line x1="${pos[e.source][0]}" y1="${pos[e.source][1]}" x2="${pos[e.target][0]}" y2="${pos[e.target][1]}" stroke="#A9B6CC" stroke-width="1" opacity=".6"/>`:"").join("")}
${g.nodes.map(n=>`<g><circle cx="${pos[n.id][0]}" cy="${pos[n.id][1]}" r="9" fill="${{customer:"#5D87FF",device:"#FFAE1F",ip:"#7a5af8",instrument:"#13DEB9",beneficiary:"#FA896B",transaction:"#A9B6CC",account:"#5A6A85"}[n.type]||"#999"}"/><text x="${pos[n.id][0]}" y="${pos[n.id][1]+22}" font-size="9" text-anchor="middle" fill="#5A6A85">${esc(n.label.slice(0,14))}</text></g>`).join("")}
${used.map((t,i)=>`<text x="${60+i*(780/Math.max(used.length-1,1))}" y="410" font-size="11" font-weight="600" text-anchor="middle" fill="#2A3547">${t}</text>`).join("")}</svg>`}
const tag=e=>pill(`${e.id} · ${e.polarity}${e.strength?" "+e.strength:""}`,e.polarity);
const TH=a=>`<tr class="text-left text-[#5A6A85]">${a.map(x=>`<th class="py-2 pr-4 font-semibold">${x}</th>`).join("")}</tr>`,TD="py-2 pr-4 align-top border-t border-[#e5eaef]";
async function show(id){
 const [v,g,au,cs]=await Promise.all([api(`/cases/${id}`),api(`/cases/${id}/graph`),api(`/cases/${id}/audit`),api("/cases")]);CASES=cs;const r=v.ring,f=v.fusion,c=v.critic,s=v.simulation,h=v.human,IN="w-full rounded-lg border border-[#e5eaef] bg-[#f6f9fc] px-3 py-2.5 text-sm mb-3 focus:outline-none focus:border-[#5D87FF]";
 shell(`<a href="#/dashboard" class="text-sm font-semibold text-[#5D87FF]">← Dashboard</a>
 <div class="flex flex-wrap items-center gap-3 mt-2 mb-6"><h1 class="text-2xl font-extrabold">${v.case_id} · Candidate Risk Ring</h1>${pill(v.status,"warn")}<span class="text-sm text-[#5A6A85]">${r.n_members} customers</span></div>
 <div class="grid grid-cols-2 xl:grid-cols-4 gap-4 mb-6">${kpi("Structural risk",r.structural+"/100","#FA896B")}${kpi("6-hour escalation signal",r.escalation+"/100","#FFAE1F")}${kpi("7-day value to "+esc(r.top_beneficiary),inr(r.exposure_inr))}${kpi("Beneficiary concentration",(r.concentration*100).toFixed(0)+"%","#13DEB9")}</div>
 <div class="${CARD}"><div class="${H}">Entity graph</div>${graphSvg(g)}<p class="text-xs text-[#5A6A85] mt-3">Members: ${r.members.join(", ")}</p></div>
 <div class="${CARD}"><div class="${H}">Evidence & rules</div><div class="overflow-x-auto"><table class="w-full text-sm">${TH(["ID","Family","Statement","Signal"])}${v.evidence.map(e=>`<tr><td class="${TD} font-bold">${e.id}</td><td class="${TD}">${e.family}</td><td class="${TD}">${esc(e.statement)}${e.signal?` <i class="text-[#5A6A85]">→ ${esc(e.signal)}</i>`:""}</td><td class="${TD}">${tag(e)}</td></tr>`).join("")}</table></div>
 <div class="${H} mt-6">Rule results (${v.active_rule})</div>${v.rule_results.map(x=>`<p class="text-sm mb-2"><b>${x.rule_id}</b> → ${pill(x.decision,"warn")} conf ${x.confidence} — ${esc(x.reason)} <span class="text-[#5A6A85]">[${x.evidence.join(", ")}]</span></p>`).join("")||'<p class="text-sm">No rule fired.</p>'}</div>
 <div class="${CARD}"><div class="${H}">Transaction timeline (last 72h)</div><pre class="text-xs bg-[#f6f9fc] rounded-lg p-4 max-h-56 overflow-auto whitespace-pre-wrap">${v.timeline.slice(-15).map(t=>`${t.ts.slice(5,16)}  ${t.payment_id}  ${t.customer_id} → ${t.beneficiary_id}  ${inr(t.amount)}`).join("\n")}</pre></div>
 <div class="grid lg:grid-cols-2 gap-6"><div class="${CARD}"><div class="${H}">What the evidence establishes</div><ul class="list-disc pl-5 text-sm space-y-1.5">${v.established.map(e=>`<li>${esc(e.statement)} <span class="text-[#5A6A85]">[${e.evidence}]</span></li>`).join("")}</ul></div>
 <div class="${CARD}"><div class="${H}">What it does not establish</div><ul class="list-disc pl-5 text-sm space-y-1.5">${v.not_established.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div>
 <div class="${CARD}"><div class="${H}">AI investigation · ${esc(JSON.stringify(v.ai_provider.fusion||"not run"))}</div><div class="flex flex-wrap gap-2"><button class="${B1}" onclick="step('${id}','investigate')">1 · Conversation + Fusion</button><button class="${B1}" onclick="step('${id}','critic')">2 · Critic Agent</button><button class="${B1}" onclick="step('${id}','simulate')">3 · Simulate interventions</button></div>
 ${v.conversation_signals?`<div class="${H} mt-6">Conversation evidence</div>${v.conversation_signals.map(x=>`<p class="text-sm mb-2">${esc(x.signal)} ${pill(x.evidence+" · "+x.confidence,x.polarity)}</p>`).join("")||'<p class="text-sm">No contextual signals.</p>'}`:""}
 ${f?`<div class="${H} mt-6">Fusion analysis · confidence ${f.confidence}</div><p class="text-sm mb-2">${esc(f.risk_summary)}</p><ul class="list-disc pl-5 text-sm text-[#5A6A85]">${f.missing_information.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}
 ${c?`<div class="${H} mt-6">Critic review ${pill(c.verdict)} ${c.recommended_confidence}</div><p class="text-sm mb-2">${esc(c.alternative_explanation)}</p><ul class="list-disc pl-5 text-sm text-[#5A6A85]">${c.weaknesses.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}</div>
 ${s?`<div class="${CARD}"><div class="${H}">Intervention simulator</div><div class="overflow-x-auto"><table class="w-full text-sm">${TH(["Option","Risk reduction","Legit impact","Cost","Review","Reversible",""])}${s.options.map(o=>`<tr class="${o.action==s.recommended_action?"font-bold bg-[#ECF2FF]":""}"><td class="${TD}">${o.action}</td><td class="${TD}">${o.potential_risk_reduction}</td><td class="${TD}">${o.potential_legitimate_impact}</td><td class="${TD}">${o.operational_cost}</td><td class="${TD}">${o.review_required?"Required":"No"}</td><td class="${TD}">${o.reversible}</td><td class="${TD} text-xs text-[#5A6A85]">${o.allowed?"":esc(o.blocked_reason)}</td></tr>`).join("")}</table></div><p class="text-xs text-[#5A6A85] mt-3">${esc(s.disclaimer)}</p></div>
 <div class="${CARD} border-l-4 border-l-[#5D87FF]"><div class="${H}">Recommended action</div><p class="text-sm"><b>${v.recommendation.action}</b> — ${esc(v.recommendation.scope)}. Human review ${v.recommendation.human_review_required?"required":"optional"}.</p></div>`:""}
 <div class="${CARD}"><div class="${H}">Human decision</div>${h?`<p class="text-sm">Automated: <b>${h.automated_decision}</b> · Human: <b>${h.human_decision}</b> by ${esc(h.actor)}${h.override?" (override)":""}<br>Reason: ${esc(h.human_reason)||"–"}</p>`:
 (s?`<input id="why" class="${IN}" placeholder="Reason (required to override)"><div class="flex gap-2"><button class="${B1}" onclick="dec('${id}','approve')">Approve recommendation</button><button class="${B3}" onclick="dec('${id}','reject')">Reject → monitor / no action</button></div>`:'<p class="text-sm text-[#5A6A85]">Run investigation, critic and simulation first.</p>')}
 <div class="mt-5 pt-5 border-t border-[#e5eaef]"><input id="note" class="${IN}" placeholder="Analyst note (fed to Conversation Agent)"><button class="${B2}" onclick="note('${id}')">Add note</button></div></div>
 <div class="${CARD}"><div class="${H}">Audit trail</div><table class="w-full text-sm">${au.map(a=>`<tr><td class="${TD}">${a.timestamp.slice(11,19)}</td><td class="${TD}">${a.actor}</td><td class="${TD}">${a.action}</td><td class="${TD} text-[#5A6A85]">${esc(a.reason).slice(0,110)}</td></tr>`).join("")}</table><a class="inline-block mt-3 text-sm font-semibold text-[#5D87FF]" href="/cases/${id}/export" target="_blank">Export bundle (manifest)</a></div>`,id)}
async function step(id,s){try{await post(`/cases/${id}/${s}`);show(id)}catch(e){alert(e.message)}}
async function dec(id,k){try{await post(`/cases/${id}/${k}`,{actor:"analyst_demo",reason:$("#why").value});show(id)}catch(e){alert(e.message)}}
async function note(id){const t=$("#note").value;if(t){await post(`/cases/${id}/comment`,{actor:"analyst_demo",text:t});show(id)}}

function route(){const h0=location.hash;$("#chat").style.display=(h0==="#/dashboard"||h0.startsWith("#/case/"))?"block":"none";const h=location.hash;(h.startsWith("#/case/")?show(h.slice(7)):h==="#/dashboard"?dashboard():landing()).catch(e=>mount(`<div class="p-10 text-center"><p class="font-bold">Unable to load</p><p class="text-sm text-[#5A6A85]">${esc(e.message)}</p></div>`))}
addEventListener("hashchange",route);chatRender();route();
setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),700)},2400);
</script></body></html>

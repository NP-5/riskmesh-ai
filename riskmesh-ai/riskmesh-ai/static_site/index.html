 <div class="${CARD}"><div class="${H}">Audit trail</div><table class="w-full text-sm">${au.map(a=>`<tr><td class="${TD}">${a.timestamp.slice(11,19)}</td><td class="${TD}">${a.actor}</td><td class="${TD}">${a.action}</td><td class="${TD} text-[#5A6A85]">${esc(a.reason).slice(0,110)}</td></tr>`).join("")}</table><button class="${B1} mt-3 mr-3" onclick="exportCsv('${id}')">Download CSV (Excel)</button><button class="inline-block mt-3 text-sm font-semibold text-[#5D87FF]" onclick="exportCase('${id}')">View export bundle (manifest)</button><pre id="exp" class="text-xs bg-[#f6f9fc] rounded-lg p-4 mt-3 max-h-64 overflow-auto whitespace-pre-wrap hidden"></pre></div>`,id)}
async function exportCase(id){const e=await api(`/cases/${id}/export`),p=$("#exp");p.textContent=JSON.stringify(e.manifest||e,null,1);p.classList.remove("hidden")}
async function exportCsv(id){const [v,au]=await Promise.all([api(`/cases/${id}`),api(`/cases/${id}/audit`)]);
const q=x=>{let t=String(x??"");if(/^[=+@]/.test(t))t="'"+t;return `"${t.replace(/"/g,'""')}"`},row=a=>a.map(q).join(","),r=v.ring,L=[];
L.push(row(["RiskMesh AI case report"]),row(["Case",v.case_id]),row(["Status",v.status]),row(["Customers",r.n_members]),row(["Structural risk (out of 100)",r.structural]),row(["6-hour escalation signal (out of 100)",r.escalation]),row(["Top beneficiary",r.top_beneficiary]),row(["7-day exposure (INR)",Math.round(r.exposure_inr)]),row(["Beneficiary concentration",(r.concentration*100).toFixed(0)+"%"]),row(["Rule version",v.active_rule]),"");
L.push(row(["EVIDENCE"]),row(["ID","Family","Statement","Signal","Polarity","Strength"]),...v.evidence.map(e=>row([e.id,e.family,e.statement,e.signal,e.polarity,e.strength])),"");
L.push(row(["RULE RESULTS"]),row(["Rule","Decision","Confidence","Reason","Evidence"]),...v.rule_results.map(x=>row([x.rule_id,x.decision,x.confidence,x.reason,(x.evidence||[]).join(" ")])),"");
if(v.recommendation)L.push(row(["RECOMMENDATION"]),row(["Action","Scope","Human review required"]),row([v.recommendation.action,v.recommendation.scope,v.recommendation.human_review_required?"Yes":"No"]),"");
if(v.human)L.push(row(["HUMAN DECISION"]),row(["Automated","Human","Actor","Override","Reason"]),row([v.human.automated_decision,v.human.human_decision,v.human.actor,v.human.override?"Yes":"No",v.human.human_reason]),"");
L.push(row(["AUDIT TRAIL"]),row(["Time","Actor","Action","Reason"]),...au.map(a=>row([a.timestamp,a.actor,a.action,a.reason])));
const u=URL.createObjectURL(new Blob(["\ufeff"+L.join("\r\n")],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=id+"_report.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function step(id,s){try{await post(`/cases/${id}/${s}`);show(id)}catch(e){alert(e.message)}}
async function dec(id,k){try{await post(`/cases/${id}/${k}`,{actor:"analyst_demo",reason:$("#why").value});show(id)}catch(e){alert(e.message)}}
async function note(id){const t=$("#note").value;if(t){await post(`/cases/${id}/comment`,{actor:"analyst_demo",text:t});show(id)}}

function route(){const h0=location.hash;$("#chat").style.display=(h0==="#/dashboard"||h0.startsWith("#/case/"))?"block":"none";const h=location.hash;(h.startsWith("#/case/")?show(h.slice(7)):h==="#/dashboard"?dashboard():landing()).catch(e=>mount(`<div class="p-10 text-center"><p class="font-bold">Unable to load</p><p class="text-sm text-[#5A6A85]">${esc(e.message)}</p></div>`))}
addEventListener("hashchange",route);chatRender();route();
setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),700)},2400);
</script></body></html>
